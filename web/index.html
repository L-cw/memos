<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181b" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <!-- memos.metadata.head -->
    <title>Memos</title>
    <script>
      // Prevent flash of light mode.
      const appearance = localStorage.getItem("appearance");
      if (appearance === `"dark"`) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <style>
      #app-initial-loading {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        background: #f4f4f5;
        color: #3f3f46;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .dark #app-initial-loading {
        background: #18181b;
        color: #e4e4e7;
      }
      .app-initial-loading-content {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .app-initial-loading-icon {
        display: flex;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 10%);
      }
      .dark .app-initial-loading-icon {
        background: #27272a;
      }
      .app-initial-loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #d4d4d8;
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      .app-initial-loading-title,
      .app-initial-loading-text {
        margin: 0;
      }
      .app-initial-loading-title {
        font-size: 14px;
        font-weight: 600;
      }
      .app-initial-loading-text {
        margin-top: 2px;
        color: #71717a;
        font-size: 12px;
      }
      .dark .app-initial-loading-text {
        color: #a1a1aa;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-initial-loading-spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body class="text-base w-full min-h-[100svh] bg-zinc-100 dark:bg-zinc-900">
    <div id="root" class="relative w-full min-h-full">
      <div id="app-initial-loading" role="status" aria-label="正在加载">
        <div class="app-initial-loading-content">
          <span class="app-initial-loading-icon"><span class="app-initial-loading-spinner"></span></span>
          <div>
            <p class="app-initial-loading-title">Memos</p>
            <p class="app-initial-loading-text">正在加载...</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- memos.metadata.body -->
  </body>
</html>
